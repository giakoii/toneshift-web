spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:toneshift}
    username: ${DB_USERNAME:toneshift}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true

app:
  public-web-url: ${PUBLIC_WEB_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

logging:
  level:
    vn.toneshift: DEBUG
